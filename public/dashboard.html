<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student ERP - Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h2>Student ERP</h2>
        <p id="sidebarRole">Dashboard</p>
      </div>
      <nav id="sidebarNav">
        <div class="nav-item active" data-section="overview">
          <span class="icon">&#9632;</span> Overview
        </div>
        <div class="nav-item" data-section="fees">
          <span class="icon">&#36;</span> Fee Payment
        </div>
        <div class="nav-item" data-section="scheduling">
          <span class="icon">&#128197;</span> Scheduling
        </div>
        <div class="nav-item" data-section="academics">
          <span class="icon">&#127891;</span> Academic Records
        </div>
      </nav>
      <div style="padding: 24px; margin-top: auto;">
        <button class="btn btn-outline" style="width:100%; color:white; border-color:rgba(255,255,255,0.3);" onclick="logout()">Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <h1 id="pageTitle">Overview</h1>
        <div class="user-info">
          <span class="role-badge" id="roleBadge"></span>
          <div class="user-avatar" id="userAvatar"></div>
          <div>
            <div id="userName" style="font-weight:600;"></div>
            <div id="userEmail" style="font-size:0.8rem; color:var(--text-muted);"></div>
          </div>
        </div>
      </div>

      <!-- Overview Section -->
      <section id="overview" class="section active">
        <div class="stats-grid" id="statsGrid"></div>
        <div class="card">
          <div class="card-header"><h3>Recent Activity</h3></div>
          <div id="recentActivity"></div>
        </div>
      </section>

      <!-- Fees Section -->
      <section id="fees" class="section">
        <div class="stats-grid" id="feeStats"></div>
        <div class="card">
          <div class="card-header">
            <h3>Fee Records</h3>
            <button class="btn btn-primary btn-sm" id="addFeeBtn" style="display:none; width:auto;" onclick="openModal('feeModal')">Add Fee</button>
          </div>
          <div id="feesTable"></div>
        </div>
      </section>

      <!-- Scheduling Section -->
      <section id="scheduling" class="section">
        <div class="card">
          <div class="card-header">
            <h3>One-on-One Sessions</h3>
            <button class="btn btn-primary btn-sm" id="bookSessionBtn" style="display:none; width:auto;" onclick="openModal('scheduleModal')">Book Session</button>
          </div>
          <div id="schedulesTable"></div>
        </div>
      </section>

      <!-- Academics Section -->
      <section id="academics" class="section">
        <div class="card">
          <div class="card-header">
            <h3>Academic Records</h3>
            <button class="btn btn-primary btn-sm" id="addRecordBtn" style="display:none; width:auto;" onclick="openModal('academicModal')">Add Record</button>
          </div>
          <div id="academicsContent"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- Pay Fee Modal -->
  <div class="modal-overlay" id="payModal">
    <div class="modal">
      <h3>Pay Fee</h3>
      <div id="payFeeDetails"></div>
      <div class="form-group">
        <label>Payment Method</label>
        <select id="paymentMethod">
          <option value="upi">UPI</option>
          <option value="card">Credit/Debit Card</option>
          <option value="netbanking">Net Banking</option>
          <option value="cash">Cash</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal('payModal')">Cancel</button>
        <button class="btn btn-success" id="confirmPayBtn">Pay Now</button>
      </div>
    </div>
  </div>

  <!-- Book Schedule Modal -->
  <div class="modal-overlay" id="scheduleModal">
    <div class="modal">
      <h3>Book One-on-One Session</h3>
      <form id="scheduleForm">
        <div class="form-group">
          <label>Faculty</label>
          <select id="facultySelect" required></select>
        </div>
        <div class="form-group">
          <label>Subject</label>
          <input type="text" id="scheduleSubject" required placeholder="e.g. Data Structures">
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="scheduleDate" required>
        </div>
        <div class="form-group">
          <label>Start Time</label>
          <input type="time" id="scheduleStart" required>
        </div>
        <div class="form-group">
          <label>End Time</label>
          <input type="time" id="scheduleEnd" required>
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea id="scheduleNotes" rows="3" placeholder="What would you like to discuss?"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal('scheduleModal')">Cancel</button>
          <button type="submit" class="btn btn-primary" style="width:auto;">Book Session</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Fee Modal (Admin) -->
  <div class="modal-overlay" id="feeModal">
    <div class="modal">
      <h3>Add Fee Record</h3>
      <form id="feeForm">
        <div class="form-group">
          <label>Student</label>
          <select id="feeStudent" required></select>
        </div>
        <div class="form-group">
          <label>Semester</label>
          <input type="text" id="feeSemester" required placeholder="Semester 3">
        </div>
        <div class="form-group">
          <label>Amount</label>
          <input type="number" id="feeAmount" required placeholder="50000">
        </div>
        <div class="form-group">
          <label>Due Date</label>
          <input type="date" id="feeDueDate" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal('feeModal')">Cancel</button>
          <button type="submit" class="btn btn-primary" style="width:auto;">Create Fee</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Academic Record Modal -->
  <div class="modal-overlay" id="academicModal">
    <div class="modal">
      <h3>Add Academic Record</h3>
      <form id="academicForm">
        <div class="form-group">
          <label>Student</label>
          <select id="academicStudent" required></select>
        </div>
        <div class="form-group">
          <label>Semester</label>
          <input type="text" id="academicSemester" required placeholder="Semester 3">
        </div>
        <div class="form-group">
          <label>Subject Name</label>
          <input type="text" id="subjectName" required placeholder="Data Structures">
        </div>
        <div class="form-group">
          <label>Subject Code</label>
          <input type="text" id="subjectCode" required placeholder="CS301">
        </div>
        <div class="form-group">
          <label>Credits</label>
          <input type="number" id="subjectCredits" value="3" required>
        </div>
        <div class="form-group">
          <label>Grade</label>
          <select id="subjectGrade">
            <option value="">Pending</option>
            <option value="A+">A+</option>
            <option value="A">A</option>
            <option value="B+">B+</option>
            <option value="B">B</option>
            <option value="C+">C+</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="F">F</option>
          </select>
        </div>
        <div class="form-group">
          <label>Marks</label>
          <input type="number" id="subjectMarks" placeholder="85">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal('academicModal')">Cancel</button>
          <button type="submit" class="btn btn-primary" style="width:auto;">Save Record</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
